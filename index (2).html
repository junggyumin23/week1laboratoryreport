<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #faf5f6;
      color: #f6f1e6;
    }
    .card {
      background: #c71c47;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }
    button {
      background: #3d3533;
      color: #faf5f6;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, I am Gyumin Jung</h1>
    <p>I love dogs.</p>
    <p id="detail">I am a psychology major.</p>
    <button id="more">Click for more</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "I love music.";
      button.textContent = "Cya :)";
    });
  </script>
</body>
</html>
